name: Snyk Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  snyk:
    runs-on: ubuntu-latest

    # Secrets can't be used in step `if:` conditions, so expose it as an env var.
    # Without the SNYK_TOKEN repository secret the scan is skipped instead of failing.
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Snyk CLI
        if: env.SNYK_TOKEN != ''
        run: npm install -g snyk@1

      # Scans the root, client and server package-lock.json files.
      # Fails the check on high or critical vulnerabilities.
      - name: Test dependencies for vulnerabilities
        if: env.SNYK_TOKEN != ''
        run: snyk test --all-projects --severity-threshold=high

      # On main, upload a snapshot (even if the test step failed) so the Snyk dashboard stays current.
      - name: Monitor main branch
        if: ${{ !cancelled() && env.SNYK_TOKEN != '' && github.event_name == 'push' }}
        run: snyk monitor --all-projects

      - name: Skip notice
        if: env.SNYK_TOKEN == ''
        run: echo "::warning::SNYK_TOKEN secret is not set, so the Snyk scan was skipped."
